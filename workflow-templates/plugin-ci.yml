name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint + compile + manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff
        run: ruff check . --config ruff.toml

      - name: Compile check
        run: python -c "import json,subprocess,sys; m=json.load(open('plugin.json',encoding='utf-8')); sys.exit(subprocess.call([sys.executable,'-m','compileall','-q',m['entry']['module']]))"

      - name: Validate manifest
        run: |
          python - <<'PY'
          import json
          m = json.load(open('plugin.json', encoding='utf-8'))
          for field in ('schema', 'id', 'name', 'version', 'service', 'kind', 'engine', 'entry'):
              assert field in m, f'missing manifest field: {field}'
          assert m['kind'] == 'service', f"expected kind=service, got {m['kind']}"
          print('manifest OK:', m['id'], m['version'])
          PY
