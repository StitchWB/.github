name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: release tag or commit sha
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Desktop app (Windows)
        - Desktop app (Linux)
        - Web version
        - Service plugin
        - Distribution server / marketplace
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. … 2. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: App logs (Logs page → export) or plugin stderr. Redact secrets and account data.
    validations:
      required: false
